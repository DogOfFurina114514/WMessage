<!DOCTYPE html>
<html lang="zh-CN" class="theme-web">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>WMessage 验证</title>
  <meta name="theme-color" content="#0b0e1a">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/theme-web.css">
  <style>
    .auth-result { position: relative; z-index: 2; text-align: center; padding: 40px 20px; }
    .auth-result .mark { width: 110px; height: 110px; margin: 0 auto 22px; display: block; }
    .auth-result h1 { font-size: 24px; letter-spacing: 2px; margin: 0 0 10px; color: #6ee7a8; text-shadow: 0 0 18px rgba(52,211,153,.6); }
    .auth-result p { color: #a0c4ff; font-size: 14px; line-height: 1.9; margin: 0; word-break: break-all; }
    .auth-result .btn { display:inline-block; margin-top:22px; padding:12px 34px; border-radius:12px; background:rgba(79,172,254,.92); color:#fff; font-size:14px; font-weight:600; text-decoration:none; letter-spacing:2px; }
    .auth-result .btn:active { opacity:.85; }
  </style>
</head>
<body>
  <div class="auth">
    <div class="orb a"></div><div class="orb b"></div>
    <main class="auth-result" id="root">
      <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" fill="rgba(52,211,153,0.14)" stroke="#34d399" stroke-width="6"/>
        <path d="M38 61l15 15 29-31" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>完成</h1>
      <p>邮箱验证已完成，你现在可以登录使用了</p>
      <a class="btn" href="./">返回登录</a>
    </main>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/vendor/supabase.js"></script>
  <script>
    // 验证已在服务端完成（官方验证页处理完毕后重定向到本页，并随 URL 带回会话）。
    // 本页只负责恢复会话，然后呈现唯一的完成状态。
    (async function () {
      try {
        const url = window.APP_CONFIG.supabaseUrl;
        const key = window.APP_CONFIG.supabaseKey;
        const code = new URLSearchParams(location.search).get('code');
        const hash = new URLSearchParams(location.hash.slice(1));
        const accessToken = hash.get('access_token');
        let sb = null;

        if (code) {
          // PKCE 流程：验证后回跳携带一次性 code
          sb = window.supabase.createClient(url, key, { auth: { persistSession: true, flowType: 'pkce', detectSessionInUrl: false } });
          await sb.auth.exchangeCodeForSession(code);
        } else if (accessToken) {
          // 隐式流程：验证后回跳携带 access_token（hash 中）
          sb = window.supabase.createClient(url, key, { auth: { persistSession: true, detectSessionInUrl: false } });
          await sb.auth.setSession({ access_token: accessToken, refresh_token: hash.get('refresh_token') || '' });
        }
      } catch (e) {
        // 本页仅一种终态：完成（官方验证失败时不会重定向到本页）
      }
    })();
  </script>
</body>
</html>
