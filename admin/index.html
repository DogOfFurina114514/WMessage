<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>WMessage 管理面板</title>
  <meta name="theme-color" content="#0b0e1a">
  <link rel="icon" href="../icons/favicon-32.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <!-- 登录视图 -->
  <div class="auth" id="loginView">
    <div class="orb a"></div><div class="orb b"></div>
    <div class="auth-card">
      <div class="auth-brand">
        <img src="../logo.svg" alt="WMessage">
        <h1>WMessage</h1>
        <p>管理面板</p>
      </div>
      <form id="adminForm" autocomplete="off">
        <div class="field">
          <label>管理员账号</label>
          <input id="adminUser" placeholder="管理员账号" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input id="adminPass" type="password" placeholder="密码" required>
        </div>
        <div class="auth-error" id="adminError"></div>
        <button class="btn btn-primary" id="adminSubmit" type="submit">登 录</button>
      </form>
    </div>
  </div>

  <!-- 面板视图 -->
  <div class="admin-shell" id="panelView" hidden>
    <header class="admin-head">
      <div class="admin-title">WMessage 管理面板</div>
      <div class="admin-user">
        <span id="adminName"></span>
        <button class="btn btn-ghost" id="logoutBtn" type="button">退出</button>
      </div>
    </header>
    <main class="admin-main">
      <section class="admin-card">
        <h2>系统状态</h2>
        <div id="healthBox" class="admin-muted">检测中…</div>
      </section>
      <section class="admin-card">
        <h2>API 服务地址</h2>
        <div class="api-row">
          <input id="apiBase" placeholder="https://xxx.workers.dev">
          <button class="btn btn-primary api-btn" id="saveApiBtn" type="button">保存</button>
        </div>
        <p class="admin-tip">修改后保存到浏览器本地，立即生效；主程序与手机端需用同一浏览器访问。</p>
      </section>
      <section class="admin-card">
        <h2>使用说明</h2>
        <ul class="admin-tip">
          <li>本面板仅通过直接输入网址访问：<code>https://dogoffurina114514.github.io/WMessage/admin</code></li>
          <li>站点、应用内没有任何指向本页的链接与入口。</li>
          <li>账号与密码校验在浏览器本地完成；如需强安全（防查看源码），可后续把校验移到后端。</li>
        </ul>
      </section>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
